<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainee Program 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #021634;
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position: fixed; inset: 0; overflow: hidden; }

  /* ===== Nền đáy đại dương: fade-in ===== */
  .bg {
    position: absolute; inset: 0;
    background: #031a3d center / cover no-repeat;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  .bg.show { opacity: 1; }

  /* ===== Canvas ===== */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #fx { z-index: 1; }
  /* Glow xanh nhẹ quanh cá voi */
  #whale {
    z-index: 3;
    filter: drop-shadow(0 0 10px rgba(120, 220, 255, .75))
            drop-shadow(0 0 32px rgba(40, 150, 255, .55))
            brightness(1.06) saturate(1.08);
  }

  /* ===== Logo ===== */
  .logo-wrap { position: absolute; z-index: 4; pointer-events: none; }
  .logo-wrap.on { animation: float 6s ease-in-out infinite; }
  .logo {
    width: 100%; height: 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transform-origin: 50% 65%;
    will-change: transform, filter, opacity;
  }
  .logo-wrap.on .logo {
    animation:
      logoIn 1.8s cubic-bezier(.2, .9, .25, 1) forwards,
      logoGlow 3.6s ease-in-out 1.8s infinite;
  }
  /* Trồi lên như bị nước đẩy + scale-up + fade-in + lóe sáng */
  @keyframes logoIn {
    0%   { opacity: 0; transform: translateY(14%) scale(.55); filter: blur(8px) brightness(1.7) drop-shadow(0 0 0 rgba(120,220,255,0)); }
    55%  { opacity: 1; transform: translateY(-3%) scale(1.07); filter: blur(0px) brightness(1.3) drop-shadow(0 0 22px rgba(140,230,255,.7)); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px) brightness(1) drop-shadow(0 0 6px rgba(120,220,255,.25)); }
  }
  /* Lung linh nhẹ liên tục */
  @keyframes logoGlow {
    0%, 100% { filter: blur(0px) brightness(1)    drop-shadow(0 0 6px  rgba(120,220,255,.25)); }
    50%      { filter: blur(0px) brightness(1.12) drop-shadow(0 0 18px rgba(140,230,255,.6)); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .sp {
    position: absolute; border-radius: 50%; opacity: 0; display: none;
    background: radial-gradient(circle, #fff 0 18%, rgba(180,235,255,.75) 38%, rgba(180,235,255,0) 70%);
  }
  .logo-wrap.on .sp { display: block; animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3); }
    50%      { opacity: 1; transform: scale(1); }
  }

  /* ===== Dòng tên tác giả ===== */
  .credit {
    position: absolute; left: 0; right: 0; z-index: 4;
    text-align: center; pointer-events: none;
    padding: 0 4vw; box-sizing: border-box;
    font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    font-weight: 400;
    font-size: clamp(12px, 1.25vw, 20px);
    letter-spacing: .06em;
    color: #d6f0ff;
    opacity: .85;
    text-shadow: 0 0 10px rgba(80, 190, 255, .55), 0 1px 2px rgba(0, 20, 60, .6);
  }
  .credit .w { display: inline-block; white-space: nowrap; }
  .credit .c {
    display: inline-block;
    opacity: 0; transform: translateY(6px); filter: blur(4px);
    transition: opacity .6s ease, transform .6s ease, filter .6s ease;
  }
  .credit.show .c {
    opacity: 1; transform: none; filter: none;
    transition-delay: calc(var(--i) * var(--st, 38ms));
  }

  /* ===== Loading ===== */
  .loader {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #021634; color: #bfe6ff;
    font: 400 13px/1.4 'Be Vietnam Pro', system-ui, sans-serif; letter-spacing: .08em;
    text-align: center; padding: 0 24px;
    transition: opacity .7s ease;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(150, 215, 255, .2); border-top-color: #7fd6ff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Nút phát lại ===== */
  .replay {
    position: fixed; z-index: 10;
    left: 50%; transform: translateX(-50%);
    bottom: max(12px, env(safe-area-inset-bottom));
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(190, 230, 255, .25);
    background: rgba(5, 30, 70, .35); color: rgba(220, 240, 255, .8);
    font: 400 12px/1 'Be Vietnam Pro', system-ui, sans-serif; letter-spacing: .06em;
    opacity: .4; transition: opacity .25s ease, background .25s ease;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .replay:hover, .replay:focus-visible { opacity: 1; background: rgba(10, 60, 120, .5); outline: none; }

  /* ===== Giảm chuyển động ===== */
  @media (prefers-reduced-motion: reduce) {
    .bg { transition: none; }
    .credit .c { transition: none; }
    .replay { display: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <canvas id="fx"></canvas>
  <canvas id="whale"></canvas>
  <div class="logo-wrap" id="logoWrap"><div class="logo" id="logo"></div></div>
  <div class="credit" id="credit"></div>
</div>

<button class="replay" id="replay" type="button" aria-label="Phát lại hiệu ứng">↻ Phát lại</button>

<div class="loader" id="loader">
  <div class="ring"></div>
  <div id="loaderText">Đang tải… 0%</div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIG — chỉnh các thông số chính ở đây
   ===================================================================== */
const CONFIG = {
  // Thư mục ảnh: thử lần lượt. '' = cùng thư mục với index.html, 'assets/' = thư mục con assets
  assetDirs: ['', 'assets/'],
  files: { background: 'background.png', whale: 'whale.png', logo: 'logo.png' },

  // Nội dung dòng tên tác giả (đúng nguyên văn)
  creditText: 'Cá doi con: Nguyễn Tuấn Hưng (26520645)',

  // Thời gian các giai đoạn (ms)
  timing: {
    bgFadeMs: 1600,          // nền hiện mờ dần
    swimDelayMs: 900,        // chờ bao lâu thì cá voi bắt đầu bơi vào
    swimDurationMs: 6200,    // thời gian bơi vào tới vị trí cuối
    logoAtSwimFraction: 0.68,// logo hiện khi cá voi đã bơi được ~68% hành trình
    creditAfterLogoMs: 1100, // dòng tên hiện sau logo bao lâu
    creditStaggerMs: 38      // độ trễ giữa từng chữ của dòng tên (stagger)
  },

  whale: {
    slices: 96,              // số dải cắt dọc (60–120)
    finalCenterX: 0.513,     // vị trí cuối của cá voi (tỉ lệ theo viewport, 0–1)
    finalCenterY: 0.473,
    widthFracLandscape: 0.49,// bề rộng thân cá voi so với chiều rộng màn hình (ngang)
    widthFracPortrait: 0.84, // ... khi màn hình dọc (mobile)
    startScale: 0.78,        // scale lúc mới bơi vào (nhỏ -> lớn tạo chiều sâu)
    ampSwim: 0.15,           // biên độ uốn lượn khi đang bơi (tỉ lệ theo chiều cao thân)
    ampIdle: 0.07,           // biên độ uốn lượn khi bơi tại chỗ
    waveCycles: 0.9,         // số chu kỳ sóng dọc thân
    envelopePower: 1.7,      // càng lớn: đầu càng ít uốn, đuôi quẫy càng mạnh
    freqSwim: 2.4,           // Hz — tốc độ vẫy đuôi lúc bơi vào
    freqIdle: 0.75,          // Hz — tốc độ vẫy đuôi lúc bơi tại chỗ
    pitchMaxDeg: 7,          // góc ngóc lên/chúi xuống tối đa
    pathAmplitude: 0.11,     // độ cong của quỹ đạo bơi vào (tỉ lệ theo chiều cao màn hình)
    pathWaves: 1.1,          // số nhịp lượn của quỹ đạo
    bobAmp: 0.012,           // nhún lên xuống (tỉ lệ chiều cao màn hình)
    bobSpeed: 0.7,           // Hz
    // Dự phòng nếu không tự dò được viền ảnh (tỉ lệ theo ảnh gốc)
    fallbackBBox: { x: 0.095, y: 0.177, w: 0.866, h: 0.701 }
  },

  logo: {
    widthRatio: 0.41,        // bề rộng logo so với bề rộng cá voi
    portraitExtra: 0.35,     // cộng thêm khi màn hình dọc
    overlap: 0.30,           // logo chồng nhẹ lên đầu cá voi
    sparkles: 8,
    fallbackBBox: { x: 0.262, y: 0.256, w: 0.428, h: 0.427 }
  },

  fx: {
    ambientBubblesPerSec: 7,
    trailBubblesPerSecSwim: 38,
    trailBubblesPerSecIdle: 4,
    maxBubbles: 260,
    marineSnow: 80,
    rays: true
  }
};

/* =====================================================================
   Tiện ích
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// Trang giới thiệu này cần chạy đầy đủ hiệu ứng cá voi, logo và nước.
// Không để thiết lập giảm chuyển động của hệ điều hành vô hiệu hóa animation.
const reduceMotion = false;

const stageEl = $('stage'), bgEl = $('bg'), fxCv = $('fx'), whaleCv = $('whale');
const logoWrap = $('logoWrap'), logoEl = $('logo'), creditEl = $('credit');
const loaderEl = $('loader'), loaderText = $('loaderText');
const fxG = fxCv.getContext('2d');
const wG = whaleCv.getContext('2d');

/* =====================================================================
   Preload ảnh (thử lần lượt các thư mục trong CONFIG.assetDirs)
   ===================================================================== */
function loadFrom(url) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => resolve({ img: im, url });
    im.onerror = () => reject(new Error(url));
    im.src = url;
  });
}
async function loadAsset(file) {
  for (const d of CONFIG.assetDirs) {
    try { return await loadFrom(d + file); } catch (e) { /* thử đường dẫn kế tiếp */ }
  }
  throw new Error(file);
}

/* Tự dò viền (bounding box) phần có nội dung của ảnh nền trong suốt.
   Nếu mở bằng file:// trình duyệt có thể chặn getImageData -> dùng fallback. */
function detectBBox(img, minFrac, fallback) {
  try {
    const sw = Math.min(800, img.naturalWidth);
    const sh = Math.round(sw * img.naturalHeight / img.naturalWidth);
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, sw, sh);
    const d = g.getImageData(0, 0, sw, sh).data;
    const cols = new Uint16Array(sw), rows = new Uint16Array(sh);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      const i = (y * sw + x) * 4;
      const solid = d[i + 3] > 24 && !(d[i] > 243 && d[i + 1] > 243 && d[i + 2] > 243);
      if (solid) { cols[x]++; rows[y]++; }
    }
    const tc = Math.max(1, Math.round(sh * minFrac)), tr = Math.max(1, Math.round(sw * minFrac));
    let x0 = 0, x1 = sw - 1, y0 = 0, y1 = sh - 1;
    while (x0 < sw && cols[x0] < tc) x0++;
    while (x1 > 0 && cols[x1] < tc) x1--;
    while (y0 < sh && rows[y0] < tr) y0++;
    while (y1 > 0 && rows[y1] < tr) y1--;
    if (x1 <= x0 || y1 <= y0) return fallback;
    const pad = 0.012;
    const bx = clamp(x0 / sw - pad, 0, 1), by = clamp(y0 / sh - pad * 1.5, 0, 1);
    const bw = clamp((x1 + 1) / sw + pad, 0, 1) - bx, bh = clamp((y1 + 1) / sh + pad * 1.5, 0, 1) - by;
    if (bw < 0.1 || bh < 0.1) return fallback;
    return { x: bx, y: by, w: bw, h: bh };
  } catch (e) {
    return fallback;
  }
}

/* =====================================================================
   Trạng thái chung
   ===================================================================== */
let vw = 0, vh = 0, dpr = 1;
let whaleImg, whaleBB, whaleAR = 2.19, logoAR = 1.78;
let logoBB, logoNatural;
let lay = null;               // layout (vị trí/kích thước đích)

let simT = 0;                 // thời gian mô phỏng (giây) — dừng khi tab ẩn
let phase = 0;                // pha sóng vẫy đuôi (tích phân theo tần số)
let pitchS = 0;               // góc ngóc/chúi đã làm mượt
let logoShown = false, creditShown = false;
let ambientAcc = 0, trailAcc = 0;
let tailPos = { x: -999, y: -999 };

/* =====================================================================
   Layout: tính vị trí cuối của cá voi, logo, dòng tên
   ===================================================================== */
function computeLayout() {
  const W = CONFIG.whale, L = CONFIG.logo;
  const aspect = vw / vh;
  const k = clamp((1.6 - aspect) / 0.9, 0, 1);       // 0: màn ngang, 1: màn dọc
  const frac = lerp(W.widthFracLandscape, W.widthFracPortrait, k);
  let whaleW = Math.min(frac * vw, 0.5 * vh * whaleAR);
  let out;
  for (let i = 0; i < 8; i++) {
    const whaleH = whaleW / whaleAR;
    const logoW = whaleW * (L.widthRatio + k * L.portraitExtra);
    const logoH = logoW / logoAR;
    let cx = vw * lerp(W.finalCenterX, 0.5, k);
    let cy = vh * lerp(W.finalCenterY, 0.5, k);
    let logoCy = cy - whaleH / 2 - logoH / 2 + logoH * L.overlap;
    const minTop = vh * 0.11;                         // chừa dải logo của phông nền
    const shift = Math.max(0, minTop - (logoCy - logoH / 2));
    cy += shift; logoCy += shift;
    const creditTop = cy + whaleH / 2 + vh * 0.035;
    out = { cx, cy, whaleW, whaleH, logoW, logoH, logoCx: vw * 0.5, logoCy, creditTop };
    if (creditTop + 34 <= vh * 0.94) break;
    whaleW *= 0.92;                                   // quá cao -> thu nhỏ rồi tính lại
  }
  lay = out;
}

function applyLayoutToDOM() {
  // Logo: dùng background-image cắt đúng vùng bbox
  const { logoW, logoH, logoCx, logoCy } = lay;
  logoWrap.style.width = logoW + 'px';
  logoWrap.style.height = logoH + 'px';
  logoWrap.style.left = (logoCx - logoW / 2) + 'px';
  logoWrap.style.top = (logoCy - logoH / 2) + 'px';
  const b = logoBB;
  logoEl.style.backgroundSize = (logoW / b.w) + 'px ' + (logoH / b.h) + 'px';
  logoEl.style.backgroundPosition = (-b.x * logoW / b.w) + 'px ' + (-b.y * logoH / b.h) + 'px';
  creditEl.style.top = lay.creditTop + 'px';
}

function resizeCanvases() {
  vw = window.innerWidth; vh = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const [cv, g] of [[fxCv, fxG], [whaleCv, wG]]) {
    cv.width = Math.round(vw * dpr);
    cv.height = Math.round(vh * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
  }
}

/* =====================================================================
   Quỹ đạo & tư thế cá voi
   ===================================================================== */
// p: tiến độ đã ease (0..1). Trả về vị trí tâm cá voi
function pathPos(p) {
  const W = CONFIG.whale;
  const startX = vw + lay.whaleW * W.startScale * 0.5 + vw * 0.04;   // vừa ngoài mép phải
  const x = lerp(startX, lay.cx, p);
  const curve = (1 - p) * W.pathAmplitude * vh * Math.sin(p * TAU * W.pathWaves + 0.6);
  const y = lay.cy + curve - (1 - p) * vh * 0.03;
  return { x, y };
}

function bodyOffset(u, amp, K) {
  const W = CONFIG.whale;
  const env = 0.03 + 0.97 * Math.pow(clamp(u, 0, 1), W.envelopePower);
  return amp * env * Math.sin(phase - u * K);
}

/* Vẽ cá voi bằng các dải dọc, dịch Y theo sóng chạy (travelling wave) */
function drawWhale(pose) {
  const W = CONFIG.whale;
  wG.clearRect(0, 0, vw, vh);
  const Wd = lay.whaleW * pose.s, Hd = Wd / whaleAR;
  if (pose.x - Wd / 2 > vw + 20) { tailPos.x = -999; return; }   // còn ngoài màn hình

  const N = W.slices;
  const dw = Wd / N;
  const iw = whaleImg.naturalWidth, ih = whaleImg.naturalHeight;
  const sw = whaleBB.w * iw / N, sh = whaleBB.h * ih;
  const sx0 = whaleBB.x * iw, sy0 = whaleBB.y * ih;
  const amp = pose.amp * Hd, K = TAU * W.waveCycles;

  wG.save();
  wG.translate(pose.x, pose.y);
  wG.rotate(pose.theta);
  for (let i = 0; i < N; i++) {
    const u = (i + 0.5) / N;
    const o = bodyOffset(u, amp, K);
    // độ dốc để mỗi dải nghiêng theo thân -> các dải nối liền mượt
    const slope = clamp((bodyOffset(u + 1 / N, amp, K) - bodyOffset(u - 1 / N, amp, K)) / (2 * dw), -1, 1);
    wG.save();
    wG.translate(-Wd / 2 + i * dw, o);
    wG.transform(1, slope, 0, 1, 0, 0);
    wG.drawImage(whaleImg, sx0 + i * sw, sy0, sw, sh, 0, -Hd / 2, dw + 1, Hd);
    wG.restore();
  }
  wG.restore();

  // Vị trí đuôi trên màn hình (để phun bong bóng phía sau đuôi)
  const lx = Wd * 0.48, ly = bodyOffset(1, amp, K) - Hd * 0.24;
  const c = Math.cos(pose.theta), s = Math.sin(pose.theta);
  tailPos.x = pose.x + lx * c - ly * s;
  tailPos.y = pose.y + lx * s + ly * c;
}

/* =====================================================================
   Hiệu ứng nền: bong bóng, hạt bụi nước, tia sáng
   ===================================================================== */
const bubbles = [];
const snow = [];
const rays = [];

function initFx() {
  snow.length = 0; rays.length = 0;
  for (let i = 0; i < CONFIG.fx.marineSnow; i++) {
    snow.push({ x: Math.random(), y: Math.random(), r: rand(0.6, 1.9), vx: rand(-4, 4), vy: rand(-6, 5), tw: rand(0, TAU), ts: rand(0.4, 1.4) });
  }
  const xs = [0.05, 0.12, 0.2, 0.3, 0.4];
  xs.forEach((x, i) => rays.push({ x, w: rand(0.04, 0.085), ph: rand(0, TAU), sp: rand(0.25, 0.6), base: rand(0.03, 0.06) }));
}

function spawnBubble(kind) {
  if (bubbles.length >= CONFIG.fx.maxBubbles) return;
  const sc = clamp(vh / 900, 0.6, 1.6);
  if (kind === 'ambient') {
    bubbles.push({ x: rand(0, vw), y: vh + 12, r: rand(1.5, 6) * sc, vx: 0, vy: -rand(40, 110) * sc,
      wa: rand(4, 14), wf: rand(1, 2.5), ph: rand(0, TAU), age: 0, life: 90 });
  } else {
    bubbles.push({ x: tailPos.x + rand(-6, 6) * sc, y: tailPos.y + rand(-10, 10) * sc, r: rand(1.2, 4.6) * sc,
      vx: rand(10, 45) * sc, vy: -rand(15, 55) * sc,
      wa: rand(3, 9), wf: rand(1.5, 3), ph: rand(0, TAU), age: 0, life: rand(2, 4.5) });
  }
}

function updateFx(dt, t, swimming, speedF) {
  const F = CONFIG.fx;
  // bong bóng nền: tăng dần số lượng sau khi trang mở
  ambientAcc += F.ambientBubblesPerSec * clamp(t / 1.5, 0, 1) * dt;
  while (ambientAcc >= 1) { ambientAcc -= 1; spawnBubble('ambient'); }
  // vệt bong bóng sau đuôi
  if (tailPos.x > -900 && tailPos.x < vw + 40) {
    trailAcc += lerp(F.trailBubblesPerSecIdle, F.trailBubblesPerSecSwim, swimming ? speedF : 0) * dt;
    while (trailAcc >= 1) { trailAcc -= 1; spawnBubble('trail'); }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.age += dt;
    b.x += (b.vx + Math.sin(b.age * b.wf + b.ph) * b.wa) * dt;
    b.y += b.vy * dt;
    b.vx *= Math.max(0, 1 - 0.9 * dt);
    if (b.y < -20 || b.age > b.life) bubbles.splice(i, 1);
  }
  for (const s of snow) {
    s.x += s.vx * dt / vw; s.y += s.vy * dt / vh; s.tw += s.ts * dt;
    if (s.x < -0.02) s.x = 1.02; if (s.x > 1.02) s.x = -0.02;
    if (s.y < -0.02) s.y = 1.02; if (s.y > 1.02) s.y = -0.02;
  }
}

function drawFx(t) {
  fxG.clearRect(0, 0, vw, vh);

  // Tia sáng lung linh phía trên (chếch từ trái-trên xuống phải-dưới như phông nền)
  if (CONFIG.fx.rays) {
    fxG.save();
    fxG.globalCompositeOperation = 'lighter';
    for (const r of rays) {
      const a = r.base * (0.6 + 0.4 * Math.sin(t * r.sp + r.ph)) * clamp(t / 2.2, 0, 1);
      const x0 = r.x * vw, w = r.w * vw, lean = vh * 0.5, hh = vh * 0.85;
      const g = fxG.createLinearGradient(0, 0, 0, hh);
      g.addColorStop(0, 'rgba(150,215,255,' + a + ')');
      g.addColorStop(1, 'rgba(150,215,255,0)');
      fxG.fillStyle = g;
      fxG.beginPath();
      fxG.moveTo(x0, 0); fxG.lineTo(x0 + w, 0);
      fxG.lineTo(x0 + w + lean + w * 0.8, hh); fxG.lineTo(x0 + lean, hh);
      fxG.closePath(); fxG.fill();
    }
    fxG.restore();
  }

  // Hạt bụi nước
  for (const s of snow) {
    const a = 0.12 + 0.22 * (0.5 + 0.5 * Math.sin(s.tw));
    fxG.fillStyle = 'rgba(200,235,255,' + a + ')';
    fxG.beginPath(); fxG.arc(s.x * vw, s.y * vh, s.r, 0, TAU); fxG.fill();
  }

  // Bong bóng
  for (const b of bubbles) {
    let a = Math.min(1, b.age / 0.4) * Math.min(1, (b.life - b.age) / 0.8) * clamp(b.y / (vh * 0.08), 0, 1);
    if (a <= 0.01) continue;
    fxG.beginPath(); fxG.arc(b.x, b.y, b.r, 0, TAU);
    fxG.fillStyle = 'rgba(170,225,255,' + (a * 0.10) + ')'; fxG.fill();
    fxG.lineWidth = Math.max(1, b.r * 0.14);
    fxG.strokeStyle = 'rgba(210,242,255,' + (a * 0.65) + ')'; fxG.stroke();
    fxG.beginPath(); fxG.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, Math.max(0.6, b.r * 0.22), 0, TAU);
    fxG.fillStyle = 'rgba(255,255,255,' + (a * 0.7) + ')'; fxG.fill();
  }
}

/* =====================================================================
   Logo, sparkles, dòng tên
   ===================================================================== */
function buildSparkles() {
  logoWrap.querySelectorAll('.sp').forEach(n => n.remove());
  for (let i = 0; i < CONFIG.logo.sparkles; i++) {
    const s = document.createElement('i');
    s.className = 'sp';
    const size = rand(8, 16);
    s.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + rand(5, 92) + '%;top:' + rand(5, 88) +
      '%;animation-delay:' + rand(0, 3).toFixed(2) + 's;animation-duration:' + rand(2, 3.4).toFixed(2) + 's';
    logoWrap.appendChild(s);
  }
}

function buildCredit() {
  creditEl.textContent = '';
  creditEl.setAttribute('aria-label', CONFIG.creditText);
  creditEl.style.setProperty('--st', CONFIG.timing.creditStaggerMs + 'ms');
  let idx = 0;
  CONFIG.creditText.split(' ').forEach((word, wi, arr) => {
    const w = document.createElement('span');
    w.className = 'w'; w.setAttribute('aria-hidden', 'true');
    for (const ch of word) {
      const c = document.createElement('span');
      c.className = 'c'; c.textContent = ch; c.style.setProperty('--i', idx++);
      w.appendChild(c);
    }
    creditEl.appendChild(w);
    if (wi < arr.length - 1) { creditEl.appendChild(document.createTextNode(' ')); idx++; }
  });
}

/* =====================================================================
   Vòng lặp animation (requestAnimationFrame + delta time)
   ===================================================================== */
let lastNow = 0, rafId = 0;

function poseAt(dt) {
  const W = CONFIG.whale, T = CONFIG.timing;
  const tMs = simT * 1000;
  const tl = clamp((tMs - T.swimDelayMs) / T.swimDurationMs, 0, 1);   // tiến độ tuyến tính
  const p = easeOutCubic(tl);                                          // giảm tốc khi gần tới nơi
  const sp = Math.pow(1 - tl, 1.3);                                    // "độ hăng" 1 -> 0

  // Vẫy đuôi nhanh lúc bơi vào, chậm lại khi đến nơi
  const freq = lerp(W.freqIdle, W.freqSwim, sp);
  phase += TAU * freq * dt;
  const amp = reduceMotion ? W.ampIdle * 0.5 : lerp(W.ampIdle, W.ampSwim, sp);

  const pos = pathPos(p);
  // Góc ngóc/chúi theo hướng di chuyển (đầu cá voi quay trái)
  const e = 0.004;
  const a = pathPos(clamp(p - e / 2, 0, 1)), b = pathPos(clamp(p + e / 2, 0, 1));
  let target = Math.atan2(-(b.y - a.y), (a.x - b.x)) * Math.pow(1 - tl, 0.6);
  const maxR = W.pitchMaxDeg * Math.PI / 180;
  target = clamp(target, -maxR, maxR);
  pitchS += (target - pitchS) * Math.min(1, dt * 4);
  const idleSway = Math.sin(simT * 0.5) * 0.016 * (reduceMotion ? 0 : 1);

  // Nhún lên xuống chậm + trôi nhẹ khi đã tới nơi
  const settle = 0.4 + 0.6 * p;
  const bob = reduceMotion ? 0 : Math.sin(simT * TAU * W.bobSpeed) * W.bobAmp * vh * settle;
  const drift = reduceMotion ? 0 : Math.sin(simT * 0.37) * 0.004 * vw * p;

  return {
    x: pos.x + drift, y: pos.y + bob,
    s: lerp(W.startScale, 1, p),
    theta: pitchS + idleSway,
    amp, tl, sp
  };
}

function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (!lastNow) lastNow = now;
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;
  simT += dt;

  const T = CONFIG.timing;
  const pose = poseAt(dt);
  drawWhale(pose);

  // Các mốc: logo -> dòng tên
  const tMs = simT * 1000;
  const logoAt = T.swimDelayMs + T.swimDurationMs * T.logoAtSwimFraction;
  if (!logoShown && tMs >= logoAt) { logoShown = true; logoWrap.classList.add('on'); }
  if (!creditShown && tMs >= logoAt + T.creditAfterLogoMs) { creditShown = true; creditEl.classList.add('show'); }

  const swimming = pose.tl > 0 && pose.tl < 1;
  updateFx(dt, simT, swimming, pose.sp);
  drawFx(simT);
}

/* Giảm chuyển động: dựng luôn bố cục cuối, không chạy vòng lặp */
function renderStatic() {
  phase = 0.6;
  simT = 999;
  const pose = poseAt(0);
  drawWhale({ ...pose, x: lay.cx, y: lay.cy, s: 1, theta: 0 });
  fxG.clearRect(0, 0, vw, vh);
}

function start() {
  simT = 0; phase = 0; pitchS = 0; lastNow = 0;
  logoShown = creditShown = false;
  ambientAcc = trailAcc = 0; bubbles.length = 0; tailPos.x = -999;
  logoWrap.classList.remove('on');
  creditEl.classList.remove('show');
  bgEl.style.transition = 'none';
  bgEl.classList.remove('show');
  void bgEl.offsetWidth;
  bgEl.style.transition = '';
  bgEl.style.transitionDuration = CONFIG.timing.bgFadeMs + 'ms';

  if (reduceMotion) {
    bgEl.style.transition = 'none';
    bgEl.classList.add('show');
    logoWrap.classList.add('on');
    creditEl.classList.add('show');
    renderStatic();
    return;
  }
  requestAnimationFrame(() => bgEl.classList.add('show'));
  if (!rafId) rafId = requestAnimationFrame(frame);
}

/* =====================================================================
   Khởi động
   ===================================================================== */
let resizeQueued = false;
function onResize() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    if (!whaleImg) return;
    resizeCanvases(); computeLayout(); applyLayoutToDOM();
    if (reduceMotion) renderStatic();
  });
}

async function boot() {
  const names = ['background', 'whale', 'logo'];
  let done = 0;
  const upd = () => { loaderText.textContent = 'Đang tải… ' + Math.round(done / names.length * 100) + '%'; };
  upd();
  try {
    const res = await Promise.all(names.map(n => loadAsset(CONFIG.files[n]).then(r => { done++; upd(); return r; })));
    const [bg, wh, lg] = res;

    bgEl.style.backgroundImage = 'url("' + bg.url + '")';
    logoEl.style.backgroundImage = 'url("' + lg.url + '")';
    whaleImg = wh.img;

    whaleBB = detectBBox(wh.img, 0.0025, CONFIG.whale.fallbackBBox);
    logoBB = detectBBox(lg.img, 0.02, CONFIG.logo.fallbackBBox);
    whaleAR = (whaleBB.w * wh.img.naturalWidth) / (whaleBB.h * wh.img.naturalHeight);
    logoAR = (logoBB.w * lg.img.naturalWidth) / (logoBB.h * lg.img.naturalHeight);

    buildSparkles(); buildCredit(); initFx();
    resizeCanvases(); computeLayout(); applyLayoutToDOM();

    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    loaderEl.classList.add('hide');
    setTimeout(() => loaderEl.remove(), 800);
    start();
  } catch (err) {
    loaderEl.querySelector('.ring').style.display = 'none';
    loaderText.innerHTML = 'Không tải được ảnh: <b>' + err.message + '</b><br>Hãy đặt background.png, whale.png, logo.png cùng thư mục với index.html (hoặc trong thư mục assets/).';
  }
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
$('replay').addEventListener('click', () => { if (whaleImg) start(); });
boot();

})();
</script>
</body>
